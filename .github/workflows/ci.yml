name: CI — RecargaYa Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  tests-unitarios:
    name: Tests Unitarios y BDD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Correr tests unitarios TDD
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Correr tests BDD
        run: |
          pytest tests/bdd/ -v --tb=short

  tests-rendimiento:
    name: Tests de Rendimiento Locust
    runs-on: ubuntu-latest
    needs: tests-unitarios

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Levantar API en background
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Verificar que la API responde
        run: |
          curl -f http://localhost:8000/health

      - name: Correr prueba de rendimiento Locust
        run: |
          locust -f tests/performance/locustfile.py \
            --headless \
            -u 30 \
            -r 5 \
            --run-time 60s \
            --host http://localhost:8000 \
            --only-summary \
            --csv=tests/performance/resultados

      - name: Verificar P95 menor a 300ms
        run: |
          python - <<'EOF'
          import csv, sys

          archivo = "tests/performance/resultados_stats.csv"
          umbral = 300

          with open(archivo, newline="") as f:
              reader = csv.DictReader(f)
              filas = list(reader)

          fallos = []
          for fila in filas:
              nombre = fila.get("Name", "")
              if nombre == "Aggregated":
                  continue
              p95 = float(fila.get("95%", 0))
              print(f"{nombre}: P95 = {p95}ms")
              if p95 >= umbral:
                  fallos.append((nombre, p95))

          if fallos:
              for nombre, p95 in fallos:
                  print(f"FAIL: {nombre} tiene P95 {p95}ms >= {umbral}ms")
              sys.exit(1)
          else:
              print(f"PASS: todos los endpoints tienen P95 < {umbral}ms")
              sys.exit(0)
          EOF

      - name: Subir resultados de rendimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-resultados
          path: tests/performance/resultados_*.csv